name: Validation

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ''
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: Download and test pinned upstream releases in disposable homes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: macOS 15 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # Native host and UI checks can exceed 20 minutes on hosted runners.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Confirm native architecture
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          printf 'Native host: macOS %s, %s\n' "$(sw_vers -productVersion)" "$(uname -m)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the hosted desktop awake for native checks
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          /usr/bin/osascript -l JavaScript -e '
            ObjC.import("Foundation");
            function run(argv) {
              var source = $.NSString.stringWithContentsOfFileEncodingError(argv[0] + "/src/gui/presentation.js", $.NSUTF8StringEncoding, Ref());
              var policy = (0, eval)(ObjC.unwrap(source));
              var deadline = Date.now() + 60000, last, reported = false;
              do {
                try {
                  var state = policy.read();
                  if (policy.allows(state)) {
                    policy.testDesktop();
                    return "PASS: hosted desktop is safe before the idle assertion";
                  }
                  var session = state.session || {};
                  last = {onConsole: session.kCGSSessionOnConsoleKey, loggedIn: session.kCGSessionLoginDoneKey,
                    locked: session.CGSSessionScreenIsLocked, front: state.front, displays: (state.displays || []).length,
                    savers: (state.running || []).filter(function (id) { return /^com\.apple\.screensaver/i.test(id); }),
                    screenLevel: state.screenLevel, highWindows: (state.windows || []).filter(function (window) {
                      return Number(window.kCGWindowLayer) >= state.screenLevel && Number(window.kCGWindowAlpha) > 0.01;
                    }).slice(0, 10).map(function (window) { return {layer: window.kCGWindowLayer, bounds: window.kCGWindowBounds}; })};
                } catch (error) { last = {metadataError: String(error)}; }
                if (!reported) { console.log("Waiting for hosted desktop readiness: " + JSON.stringify(last)); reported = true; }
                $.NSRunLoop.currentRunLoop.runUntilDate($.NSDate.dateWithTimeIntervalSinceNow(1));
              } while (Date.now() < deadline);
              throw new Error("Hosted desktop remained protected or unavailable: " + JSON.stringify(last));
            }
          ' "$GITHUB_WORKSPACE"
          /usr/bin/caffeinate -diu -t 2700 >/dev/null 2>&1 </dev/null &
          ci_awake_pid=$!
          kill -0 "$ci_awake_pid"
          printf 'MAC_TWEAK_CI_AWAKE_PID=%s\n' "$ci_awake_pid" >> "$GITHUB_ENV"
      - name: Native GUI startup
        run: python3 tests/gui.py
      - name: Native host startup and close
        run: python3 tests/app-host.py --lifecycle-mode=close
      - name: Syntax and isolated behavior checks
        run: /bin/bash tests/ci.sh
      - name: Native maintenance cards and both appearances
        run: python3 tests/gui-maintenance.py
      - name: Record behavioral coverage
        run: echo 'Isolated behavior and native maintenance UI suites passed on this host. macOS 27 gesture planning uses an explicit isolated store simulation; production gates are unchanged. Simulated alternate-host fixtures do not execute alternate-architecture binaries.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify upstream metadata and live installations
        if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
        env:
          MAC_TWEAK_LIVE_TEST: '1'
        run: |
          python3 tests/releases.py --upstream
          python3 tests/artifact-platforms.py --live
          /bin/bash tests/smoke.sh
          MAC_TWEAK_PREFERENCES_LIVE_TEST=1 python3 tests/preferences-live.py
      - name: Record live coverage
        if: github.event_name == 'workflow_dispatch' && inputs.live_smoke && success()
        run: echo 'Pinned upstream live installation, native tig build, verification, and repeat-run checks passed on this host.' >> "$GITHUB_STEP_SUMMARY"
      - name: Release the hosted desktop idle assertion
        if: always() && env.MAC_TWEAK_CI_AWAKE_PID != ''
        run: |
          ci_awake_command=$(/bin/ps -p "$MAC_TWEAK_CI_AWAKE_PID" -o comm= || true)
          if test "$ci_awake_command" = /usr/bin/caffeinate; then
            kill "$MAC_TWEAK_CI_AWAKE_PID" 2>/dev/null || true
          fi

  package-validation:
    name: Universal package / ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 scripts/release/build.py
      - run: python3 scripts/release/verify.py dist
